<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="mobile-web-app-capable" content="yes">

<style>
:root{
  --bg:#0d0d0f; --panel:#17171b; --panel2:#1f1f25; --line:#2a2a31;
  --txt:#f4f4f5; --muted:#9a9aa3; --acc:#ffff64; --acc2:#ff4081;
  --yt:#ff0033; --ytm:#ff0033; --gen:#ffff64; --jp:#4 db6ac;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);
  font-family:"Helvetica Neue","Programme",-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;}
a{color:inherit;text-decoration:none}
header{position:sticky;top:0;z-index:20;background:rgba(13,13,15,.92);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 20px;}
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-weight:800;font-size:26px;letter-spacing:-.5px}
.logo b{color:var(--acc);font-weight:800}
.count{color:var(--muted);font-size:13px}
.tourlink{margin-left:auto;display:inline-flex;align-items:center;gap:6px;background:linear-gradient(90deg,#ff4081,#ff8a3d);color:#160016;font-weight:800;font-size:13px;padding:8px 14px;border-radius:999px;text-decoration:none;white-space:nowrap}.tourlink:hover{filter:brightness(1.08);transform:translateY(-1px)}
.searchbar{margin-top:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.searchbar input[type=search]{flex:1;min-width:220px;background:var(--panel);border:1px solid var(--line);
  color:var(--txt);padding:11px 14px;border-radius:10px;font-size:15px;outline:none}
.searchbar input[type=search]:focus{border-color:var(--acc)}
select{background:var(--panel);border:1px solid var(--line);color:var(--txt);
  padding:11px 12px;border-radius:10px;font-size:14px;outline:none;cursor:pointer}
.wrap{max-width:1080px;margin:0 auto;padding:18px 20px 80px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 18px}
.chip{background:var(--panel);border:1px solid var(--line);color:var(--muted);
  padding:7px 13px;border-radius:999px;font-size:13px;cursor:pointer;transition:.12s;white-space:nowrap}
.chip:hover{border-color:var(--acc);color:var(--txt)}
.chip.on{background:var(--acc);color:#000;border-color:var(--acc);font-weight:700}
.artist-block{margin-bottom:30px}
.artist-h{display:flex;align-items:baseline;gap:10px;padding:10px 0;border-bottom:2px solid var(--acc);margin-bottom:6px}
.artist-h .nm{font-size:21px;font-weight:800}
.artist-h .ge{font-size:12px;color:var(--muted)}
.artist-h .n{margin-left:auto;color:var(--muted);font-size:12px}
.album-h{color:var(--acc);font-size:13px;font-weight:700;margin:14px 0 4px;letter-spacing:.3px}
.song{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;}
.song:hover{background:var(--panel)}
.song .idx{color:var(--muted);font-size:12px;width:26px;text-align:right;flex:none}
.song .ti{flex:1;min-width:0}
.song .ti .t{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song .ti .al{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts{display:flex;gap:6px;flex:none}
.btn{font-size:11px;font-weight:700;padding:6px 9px;border-radius:7px;border:1px solid var(--line);
  background:var(--panel2);color:var(--txt);transition:.12s;white-space:nowrap}
.btn:hover{transform:translateY(-1px)}
.btn.g{border-color:#5a5a2a}.btn.g:hover{background:var(--acc);color:#000}
.btn.m{border-color:#5a2a3a}.btn.m:hover{background:var(--ytm);color:#fff}
.btn.v{border-color:#5a2a2a}.btn.v:hover{background:#cc0022;color:#fff}
.btn.j{border-color:#2a5a52}.btn.j:hover{background:#26a69a;color:#fff}
.empty{text-align:center;color:var(--muted);padding:60px 0}
.toTop{position:fixed;right:18px;bottom:18px;background:var(--acc);color:#000;border:none;
  width:46px;height:46px;border-radius:50%;font-size:20px;cursor:pointer;font-weight:800;display:none}
@media(max-width:640px){
  .song .ti .al{display:none}
  .btn{padding:6px 7px}
  .acts{gap:4px}
}
</style>
</head>

<header>
  <div class="brand">

    <a class="tourlink" href="eternal-sunshine-tour.html">🎤 Eternal Sunshine Tour →</a>

    <select id="sort">

      <option value="title">曲名順</option>
    </select>
  </div>
</header>
<div class="wrap">
  <div class="chips" id="chips"></div>
  <div id="list"></div>
</div>
<button class="toTop" id="toTop">↑</button>

7%9F%A5%E3%81%A3%E3%81%A6%E3%82%8B%E5%90%8D%E6%9B%B2%29+Queen+%E2%80%93+Bohemian+Rhapsody+official+video", "yakuwa": "https://www.google.com/search?q=Crowd-Pleasers+%28%E8%AA%B0%E3%81%A7%E3%82%82%E7%9F%A5%E3%81%A3%E3%81%A6%E3%82%8B%E5%90%8D%E6%9B%B2%29+Queen+%E2%80%93+Bohemian+Rhapsody+%E5%92%8C%E8%A8%B3"}, {"artist": "Crowd-Pleasers (誰でも知ってる名曲)", "genre": null, "album": null, "title": "Queen – We Will Rock You", "genius": "https://genius.com/Queen-we-will-rock-you-lyrics", "ytmusic": "https://music.youtube.com/search?q=Crowd-Pleasers+%28%E8%AA%B0%E3%81%A7%E3%82%82%E7%9F%A5%E3%81%A3%E3%81%A6%E3%82%8B%E5%90%8D%E6%9B%B2%29+Queen+%E2%80%93+We+Will+Rock+You", "mv": "https://www.youtube.com/results?search_query=Crowd-Pleasers+%28%E8%AA%B0%E3%81%A7%E3%82%82%E7%9F%A5%E3%81%A3%E3%81%A6%E3%82%8B%E5%90%8D%E6%9B%B2%29+Queen+%E2%80%93+We+Will+Rock+You+official+video", "yakuwa": "https://www.google.com/search?q=Crowd-Pleasers+%28%E8%AA%B0%E3%81%A7%E3%82%82%E7%9F%A5%E3%81%A3%E3%81%A6%E3%82%8B%E5%90%8D%E6%9B%B2%29+Queen+%E2%80%93+We+Will+Rock+You+%E5%92%8C%E8%A8%B3"}, {"artist": "Crowd-Pleasers (誰でも知ってる名曲)", "genre": null, "album": null, "title": "ABBA – Dancing Queen", "genius": "https://genius.com/Abba-dancing-queen-lyrics", "ytmusic": "https://music.youtube.com/search?q=Crowd-Pleasers+%28%E8%AA%B0%E3%81%A7%E3%82%82%E7%9F%A5%E3%81%A3%E3%81%A6%E3%82%8B%E5%90%8D%E6%9B%B2%29+ABBA+%E2%80%93+Dancing+Queen", "mv": "https://www.youtube.com/results?search_query=Crowd-Pleasers+%28%E8%AA%B0%E3%81%A7%E3%82%82%E7%9F%A5%E3%81%A3%E3%81%A6%E3%82%8B%E5%90%8D%E6%9B%B2%29+ABBA+%E2%80%93+Dancing+Queen+official+video", "yakuwa": "https://www.google.com/search?q=Crowd-Pleasers+%28%E8%AA%B0%E3%81%A7%E3%82%82%E7%9F%A5%E3%81%A3%E3%81%A6%E3%82%8B%E5%90%8D%E6%9B%B2%29+ABBA+%E2%80%93+Dancing+Queen+%E5%92%8C%E8%A8%B3"}, {"artist": "Crowd-Pleasers (誰でも知ってる名曲)", "genre": null, "album": null, "title": "a-ha – Take On Me", "genius": "https://genius.com/A-ha-take-on-me-lyrics", "ytmusic": "https://music.youtube.com/search?q=Crowd-Pleasers+%28%E8%AA%B0%E3%81%A7%E3%82%82%E7%9F%A5%E3%81%A3%E3%81%A6%E3%82%8B%E5%90%8D%E6%9B%B2%29+a-ha+%E2%80%93+Take+On+Me", "mv": "https://www.youtube.com/results?search_query=Crowd-Pleasers+%28%E8%AA%B0%E3%81%A7%E3%82%82%E7%9F%A5%E3%81%A3%E3%81%A6%E3%82%8B%E5%90%8D%E6%9B%B2%29+a-ha+%E2%80%93+Take+On+Me+official+video", "yakuwa": "https://www.google.com/search?q=Crowd-Pleasers+%28%E8%AA%B0%E3%81%A7%E3%82%82%E7%9F%A5%E3%81%A3%E3%81%A6%E3%82%8B%E5%90%8D%E6%9B%B2%29+a-ha+%E2%80%93+Take+On+Me+%E5%92%8C%E8%A8%B3"}, {"artist": "Crowd-Pleasers (誰でも知ってる名曲)", "genre": null, "album": null, "title": "Europe – The Final Countdown", "genius": "https://genius.com/Europe-the-final-countdown-lyrics", "ytmusic": "https://music.youtube.com/search?q=Crowd-Pleasers+%28%E8%AA%B0%E3%81%A7%E3%82%82%E7%9F%A5%E3%81%A3%E3%81%A6%E3%82%8B%E5%90%8D%E6%9B%B2%29+Europe+%E2%80%93+The+Final+Countdown", "mv": "https://www.youtube.com/results?search_query=Crowd-Pleasers+%28%E8%AA%B0%E3%81%A7%E3%82%82%E7%9F%A5%E3%81%A3%E3%81%A6%E3%82%8B%E5%90%8D%E6%9B%B2%29+Europe+%E2%80%93+The+Final+Countdown+official+video", "yakuwa": "https://www.google.com/search?q=Crowd-Pleasers+%28%E8%AA%B0%E3%81%A7%E3%82%82%E7%9F%A5%E3%81%A3%E3%81%A6%E3%82%8B%E5%90%8D%E6%9B%B2%29+Europe+%E2%80%93+The+Final+Countdown+%E5%92%8C%E8%A8%B3"}];
const elList=document.getElementById('list'), elChips=document.getElementById('chips'),
      elQ=document.getElementById('q'), elCount=document.getElementById('count'),
      elSort=document.getElementById('sort');
let curArtist='ALL';

// build artist chips (sorted by count desc)
const counts={};
SONGS.forEach(s=>counts[s.artist]=(counts[s.artist]||0)+1);
const artists=Object.keys(counts).sort((a,b)=>counts[b]-counts[a]);
function renderChips(){
  let h='<div class="chip'+(curArtist==='ALL'?' on':'')+'" data-a="ALL">すべて ('+SONGS.length+')</div>';
  artists.forEach(a=>{h+='<div class="chip'+(curArtist===a?' on':'')+'" data-a="'+esc(a)+'">'+esc(a)+' ('+counts[a]+')</div>';});
  elChips.innerHTML=h;
  elChips.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{curArtist=c.dataset.a;renderChips();render();window.scrollTo(0,0);});
}
function esc(s){return (s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}

function render(){
  const q=elQ.value.trim().toLowerCase();
  let rows=SONGS.filter(s=>{
    if(q) return (s.title+' '+s.artist+' '+(s.album||'')).toLowerCase().includes(q); // search is global, ignores artist chip
    return curArtist==='ALL' || s.artist===curArtist;
  });
  elCount.textContent=rows.length+' 曲';
  if(!rows.length){elList.innerHTML='<div class="empty">該当する曲がありません</div>';return;}

  if(elSort.value==='title'){
    rows=rows.slice().sort((a,b)=>a.title.localeCompare(b.title));
    elList.innerHTML='<div class="artist-block">'+rows.map((s,i)=>songRow(s,i+1,true)).join('')+'</div>';
    return;
  }
  // group by artist, preserve original album order
  const order=[]; const map={};
  rows.forEach(s=>{if(!map[s.artist]){map[s.artist]=[];order.push(s.artist);}map[s.artist].push(s);});
  // sort artists by count when showing all
  if(curArtist==='ALL') order.sort((a,b)=>counts[b]-counts[a]);
  let h='';
  order.forEach(a=>{
    const list=map[a];
    h+='<div class="artist-block"><div class="artist-h"><span class="nm">'+esc(a)+'</span>'+
       (list[0].genre?'<span class="ge">'+esc(list[0].genre)+'</span>':'')+
       '<span class="n">'+list.length+' 曲</span></div>';
    let curAlbum='__init__';let idx=0;
    list.forEach(s=>{
      if(s.album!==curAlbum){curAlbum=s.album;if(curAlbum)h+='<div class="album-h">'+esc(curAlbum)+'</div>';}
      idx++; h+=songRow(s,idx,false);
    });
    h+='</div>';
  });
  elList.innerHTML=h;
}
function songRow(s,idx,showArtist){
  const sub=showArtist?esc(s.artist):(s.album?esc(s.album):'');
  return '<div class="song"><div class="idx">'+idx+'</div>'+
    '<div class="ti"><div class="t">'+esc(s.title)+'</div>'+
    (sub?'<div class="al">'+sub+'</div>':'')+'</div>'+
    '<div class="acts">'+
      '<a class="btn g" target="_blank" href="'+s.genius+'">歌詞</a>'+
      '<a class="btn m" target="_blank" href="'+s.ytmusic+'">YT Music</a>'+
      '<a class="btn v" target="_blank" href="'+s.mv+'">MV</a>'+
      '<a class="btn j" target="_blank" href="'+s.yakuwa+'">和訳</a>'+
    '</div></div>';
}
elQ.oninput=render; elSort.onchange=render;
const toTop=document.getElementById('toTop');
addEventListener('scroll',()=>toTop.style.display=scrollY>500?'block':'none');
toTop.onclick=()=>scrollTo({top:0,behavior:'smooth'});
renderChips(); render();
</script>
